name: Twelve Data virtual trading
run-name: TradeLab scan (${{ inputs.origin || github.event_name }})
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Automatic watchdog or manual request
        required: false
        type: string
        default: manual
  # Code changes run unit tests separately. Never fetch market prices just
  # because a developer edited a file: Twelve Data limits credits/minute.
  schedule:
    # Fifteen-minute weekday checks: off-peak minutes reduce congestion.
    # UK time guard in the job starts status checks after 08:00 year-round.
    # GitHub schedule delivery is best-effort and may be delayed or dropped.
    # Off-peak minute offsets also re-register the scheduler after missed runs.
    # 07:00 UTC covers 08:00 BST, and 08:00 UTC covers 08:00 GMT.
    # The first planned scan after the UK open is about 08:09 local time.
    - cron: '9,24,39,54 7-21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tradelab-paper-engine
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check UK trading window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo
          import os
          utc = datetime.now(timezone.utc)
          uk = utc.astimezone(ZoneInfo('Europe/London'))
          ny = utc.astimezone(ZoneInfo('America/New_York'))
          market = ny.weekday() < 5 and time(9, 35) <= ny.time() < time(16, 0)
          window = uk.weekday() < 5 and time(8, 0) <= uk.time() < time(21, 0)
          # Manual and code-change runs verify the pipeline, even after hours.
          # The engine allows LSE entries only with opted-in live UK data.
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          # Before US opens, run a UK status heartbeat (no market API unless enabled).
          allowed = window or event in ('push', 'workflow_dispatch')
          print(f'run={str(allowed).lower()}')
          print(f'uk_time={uk.isoformat()}')
          print(f'ny_time={ny.isoformat()}')
          print(f'market_session_open={str(market).lower()}')
          print(f'trigger={event}')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          persist-credentials: true
      # Workflow events can queue on an older commit. Re-read the authoritative
      # portfolio before simulating any fills so competing triggers cannot
      # replay older positions or overwrite newer trades.
      - name: Sync latest paper portfolio from main
        if: steps.window.outputs.run == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Prevent duplicate API scans during the provider cooldown
        id: throttle
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          try:
              data = json.loads(Path('data/paper_state.json').read_text())
              updated = datetime.fromisoformat(data['updated_utc'])
              if updated.tzinfo is None:
                  updated = updated.replace(tzinfo=timezone.utc)
              age = datetime.now(timezone.utc) - updated.astimezone(timezone.utc)
          except (ValueError, OSError, KeyError, TypeError):
              age = timedelta(days=1)
          # Two 7-8 credit requests within a minute can exceed free limits.
          # Never claim an extra scan happened if this job skipped fetching.
          scan = age >= timedelta(minutes=3)
          print(f'run={str(scan).lower()}')
          print(f'last_snapshot_age_minutes={age.total_seconds()/60:.1f}')
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true' && steps.throttle.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Update virtual trades from Twelve Data
        if: steps.window.outputs.run == 'true' && steps.throttle.outputs.run == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TRADELAB_UK_INTRADAY_ENABLED: ${{ vars.TRADELAB_UK_INTRADAY_ENABLED }}
          TRADELAB_FX_ENABLED: ${{ vars.TRADELAB_FX_ENABLED }}
          TRADELAB_TRIGGER: ${{ inputs.origin }}
        run: python scripts/paper_engine.py
      - name: Save simulated portfolio snapshot
        if: steps.window.outputs.run == 'true' && steps.throttle.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily paper portfolio"
            # Keep the virtual portfolio commit while integrating new code commits.
            # Rebase aborts on conflicts rather than overwriting repository changes.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Portfolio commit conflicts with newer repository changes; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Remote changed again; retrying sync ($attempt/3)"
              sleep 3
            done
            echo "Unable to publish portfolio after retries"
            exit 1
          fi

      - name: Verify this run and market data freshness
        if: steps.window.outputs.run == 'true' && steps.throttle.outputs.run == 'true'
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          state = json.loads(Path('data/paper_state.json').read_text())
          if str(state.get('run_id')) != os.environ['EXPECTED_RUN_ID']:
              sys.exit('Scanner health failure: portfolio was not updated by this run')
          if state.get('errors', {}).get('DATA_CONFIG'):
              sys.exit('Scanner health failure: missing Twelve Data API key')

          if state.get('market_session_open'):
              now = datetime.now(timezone.utc)
              recent = []
              for ticker, quote in state.get('quotes', {}).items():
                  try:
                      quoted = datetime.fromisoformat(quote['date'])
                      if quoted.tzinfo and 0 <= (now - quoted).total_seconds() <= 45 * 60:
                          recent.append(ticker)
                  except (TypeError, ValueError, KeyError):
                      pass
              if not recent:
                  sys.exit('Scanner health failure: no fresh intraday prices')
              print('Market scan verified; recent quotes:', ', '.join(recent))
          else:
              print('Standby verified: no active licensed market feed requested')
          PY
