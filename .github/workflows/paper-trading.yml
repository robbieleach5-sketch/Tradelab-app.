name: Daily virtual trading
on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tradelab-paper-engine
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update virtual trades from daily market data
        run: python scripts/paper_engine.py
      - name: Save simulated portfolio snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily paper portfolio"
            # Keep the virtual portfolio commit while integrating new code commits.
            # Rebase aborts on conflicts rather than overwriting repository changes.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Portfolio commit conflicts with newer repository changes; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Remote changed again; retrying sync ($attempt/3)"
              sleep 3
            done
            echo "Unable to publish portfolio after retries"
            exit 1
          fi
