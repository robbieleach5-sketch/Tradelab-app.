name: Twelve Data virtual trading
on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, 14:00–22:00 UK local time (GMT/BST).
    # The job below checks Europe/London time and exits outside the window.
    - cron: '*/15 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tradelab-paper-engine
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check UK trading window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/London'))
          allowed = now.weekday() < 5 and time(14, 0) <= now.time() <= time(21, 0)
          print(f'run={str(allowed).lower()}')
          print(f'uk_time={now.isoformat()}')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Update virtual trades from Twelve Data
        if: steps.window.outputs.run == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/paper_engine.py
      - name: Save simulated portfolio snapshot
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily paper portfolio"
            # Keep the virtual portfolio commit while integrating new code commits.
            # Rebase aborts on conflicts rather than overwriting repository changes.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Portfolio commit conflicts with newer repository changes; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Remote changed again; retrying sync ($attempt/3)"
              sleep 3
            done
            echo "Unable to publish portfolio after retries"
            exit 1
          fi
