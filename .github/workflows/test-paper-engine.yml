name: Paper engine regression tests
on:
  pull_request:
    paths:
      - 'scripts/paper_engine.py'
      - 'tests/**'
      - '.github/workflows/test-paper-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
