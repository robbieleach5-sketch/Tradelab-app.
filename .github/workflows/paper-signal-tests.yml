name: Paper Signal Tests
on:
  push:
    branches: [feature/trader-rankings-paper-signals]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated unit tests
        run: python -m unittest -v test_tradelab_rankings
