name: Paper engine regression tests
on:
  pull_request:
    paths:
      - 'scripts/paper_engine.py'
      - 'tests/test_paper_engine.py'
      - 'tests/test_cfd_proxy_paper.py'
      - 'scripts/cfd_proxy_paper.py'
      - '.github/workflows/paper-engine-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/paper_engine.py'
      - 'tests/test_paper_engine.py'
      - 'tests/test_cfd_proxy_paper.py'
      - 'scripts/cfd_proxy_paper.py'
      - '.github/workflows/paper-engine-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run paper engine tests
        run: |
          python -m py_compile scripts/paper_engine.py scripts/cfd_proxy_paper.py tests/test_paper_engine.py tests/test_cfd_proxy_paper.py
          python -m unittest discover -s tests -p 'test_*.py' -v
